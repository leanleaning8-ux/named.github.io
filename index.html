<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naira Floor Codes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, a form on top, the generated code in a highlighted card, history below. Owner-only tool. */
:root{
  --bg:#ffffff; --surface:#f5f7fa; --surface2:#eaeef4; --line:#e3e7ee;
  --fg:#1c2433; --muted:#64708a; --accent:#1c5bd8; --on-accent:#ffffff;
  --up:#16894a; --up-soft:#e2f4e9; --down:#d12f2f; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f15; --surface:#131923; --surface2:#1b2330; --line:#232d3b;
    --fg:#e7ecf4; --muted:#8c99ad; --accent:#6ea6ff; --on-accent:#08101f;
    --up:#3fcf82; --up-soft:#0f2a1d; --down:#ff6b6b; --warn:#f0c15a; --warn-soft:#2b2410;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --surface:#131923; --surface2:#1b2330; --line:#232d3b;
  --fg:#e7ecf4; --muted:#8c99ad; --accent:#6ea6ff; --on-accent:#08101f;
  --up:#3fcf82; --up-soft:#0f2a1d; --down:#ff6b6b; --warn:#f0c15a; --warn-soft:#2b2410;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:520px;margin:0 auto;padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,p{margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
form{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input{width:100%;font:inherit;font-size:18px;letter-spacing:.04em;text-transform:uppercase;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiers label{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;cursor:pointer;color:var(--fg)}
.tiers input{position:absolute;opacity:0;width:1px;height:1px}
.tiers b{font-size:19px;font-weight:800}
.tiers span{font-size:13px;color:var(--muted);font-weight:500}
.tiers label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tiers label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent)}
.err{color:var(--down);font-size:13px;min-height:18px}
.out{background:var(--up-soft);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.out .code{font-size:14px;font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--up)}
.out p{font-size:14px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow b{font-weight:700;letter-spacing:.03em;overflow-wrap:anywhere}
.hrow span{font-size:13px;color:var(--muted)}
.hrow em{grid-row:1 / span 2;grid-column:2;font-style:normal;font-weight:700;align-self:center}
.none{color:var(--muted);font-size:14px;padding:12px 0}
</style>
</head>
<body>


<div class="shell">
  <div><h1>Naira Floor Codes</h1><p class="sub">Make a top-up code for a user after they pay.</p></div>
  <p class="warn">For you only. Do not share this page.</p>
  <form id="f" novalidate>
    <div class="field"><label for="uid">User ID</label><input id="uid" type="text" placeholder="NF-XXXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
    <div class="field"><label id="tl">Amount paid for</label>
      <div class="tiers" role="radiogroup" aria-labelledby="tl">
        <label><input type="radio" name="tier" value="1M" checked><b>₦1,000,000</b><span>User paid ₦500</span></label>
        <label><input type="radio" name="tier" value="5M"><b>₦5,000,000</b><span>User paid ₦1,000</span></label>
      </div>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="primary" type="submit">Make code</button>
  </form>
  <div class="out" id="out" hidden>
    <span style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Code for <span id="oid"></span></span>
    <div class="code" id="ocode"></div>
    <p id="otext"></p>
    <div class="btns"><button class="btn" id="copyCode" type="button">Copy code</button><button class="btn" id="copyMsg" type="button">Copy message</button></div>
  </div>
  <div>
    <h2>Recent codes</h2>
    <div class="hist" id="hist"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s"></div>

<script>
(function(){
'use strict';
const PUB={"kty":"EC","crv":"P-256","x":"EQMHS8ksoNWMXXgpr61mxcA3rRufNUAxg_CUCLsJfsw","y":"YlIBKA0HOTy5Os2NbbyVNkcaOam7ik5nCYL_1vyD_24"};
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const TIERS={'1M':1000000,'5M':5000000};
const TIER_BYTE={'1M':1,'5M':2};
const BYTE_TIER={1:'1M',2:'5M'};
function sha256(msg){
  const bytes=new TextEncoder().encode(msg);
  const K=[],H=[];
  let n=2,found=0;
  while(found<64){
    let prime=true;for(let i=2;i*i<=n;i++){if(n%i===0){prime=false;break}}
    if(prime){if(found<8)H.push(Math.floor((Math.sqrt(n)%1)*4294967296));K.push(Math.floor((Math.cbrt(n)%1)*4294967296));found++}
    n++;
  }
  const l=bytes.length;const total=((l+9+63)>>6)<<6;
  const buf=new Uint8Array(total);buf.set(bytes);buf[l]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(total-4,(l*8)>>>0);dv.setUint32(total-8,Math.floor(l*8/4294967296));
  const hh=H.slice();const w=new Array(64);
  for(let o=0;o<total;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){
      const a=w[i-15],b=w[i-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);
      const s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let a=hh[0],b=hh[1],c=hh[2],d=hh[3],e=hh[4],f=hh[5],g=hh[6],h=hh[7];
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[i]+w[i])>>>0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    hh[0]=(hh[0]+a)>>>0;hh[1]=(hh[1]+b)>>>0;hh[2]=(hh[2]+c)>>>0;hh[3]=(hh[3]+d)>>>0;
    hh[4]=(hh[4]+e)>>>0;hh[5]=(hh[5]+f)>>>0;hh[6]=(hh[6]+g)>>>0;hh[7]=(hh[7]+h)>>>0;
  }
  return hh.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function hexToB32(hex,count){let out='';for(let i=0;i<count;i++)out+=B32.charAt(parseInt(hex.substr(i*2,2),16)%32);return out}
function uidOf(phone){return 'NF-'+hexToB32(sha256('uid|naira-floor|'+phone),7)}
function toHex(bytes){return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('')}
function b64uEncode(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64uDecode(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str);const o=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o}
function codeMessage(id,tierKey,nonceHex){return new TextEncoder().encode(id+'|'+tierKey+'|'+nonceHex)}

const PRIV={"kty":"EC","crv":"P-256","x":"EQMHS8ksoNWMXXgpr61mxcA3rRufNUAxg_CUCLsJfsw","y":"YlIBKA0HOTy5Os2NbbyVNkcaOam7ik5nCYL_1vyD_24","d":"D_S2bSGafXeFf_IIuqEPtpuUKAhSws9gD0kXMV2eljI"};
const KEY='naira-floor-codes-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let history=[];try{history=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(history.slice(0,60)))}catch(e){}}
let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity='1';clearTimeout(tt);tt=setTimeout(()=>{t.style.opacity='0'},2200)}
function copy(text){
  const ok=()=>toast('Copied');
  try{navigator.clipboard.writeText(text).then(ok,()=>toast('Press and hold to copy'))}catch(e){toast('Press and hold to copy')}
}
function randomBytes(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a}
async function makeCode(id,tierKey){
  const nonceBytes=randomBytes(6);const nonceHex=toHex(nonceBytes);
  const key=await crypto.subtle.importKey('jwk',PRIV,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
  const sig=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,codeMessage(id,tierKey,nonceHex)));
  const all=new Uint8Array(71);all[0]=TIER_BYTE[tierKey];all.set(nonceBytes,1);all.set(sig,7);
  return 'NF1-'+b64uEncode(all);
}
function render(){
  const h=$('#hist');
  if(!history.length){h.innerHTML='<p class="none">No codes made yet.</p>';return}
  h.innerHTML=history.map(r=>'<div class="hrow"><b>'+esc(r.code.slice(0,12))+'…</b><span>'+esc(r.id)+' · '+new Date(r.t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span><em>'+(r.tier==='5M'?'₦5,000,000':'₦1,000,000')+'</em></div>').join('');
}
let last=null;
$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  let id=$('#uid').value.toUpperCase().replace(/\s+/g,'');
  if(/^[A-Z2-9]{7}$/.test(id))id='NF-'+id;
  if(!/^NF-[A-Z2-9]{7}$/.test(id)){$('#err').textContent='Enter the ID the user sent you. It looks like NF-AB3CD4E.';return}
  if(!(window.crypto&&crypto.subtle)){$('#err').textContent='This browser cannot make codes. Open the page in Chrome or Safari.';return}
  $('#err').textContent='';
  const tier=document.querySelector('input[name="tier"]:checked').value;
  makeCode(id,tier).then(code=>{
    last={id:id,tier:tier,code:code,t:Date.now()};
    history.unshift(last);save();render();
    $('#out').hidden=false;$('#oid').textContent=id;$('#ocode').textContent=code;
    $('#otext').textContent='Copy the message below and send it to the user. The code works once, and only for '+id+'.';
  }).catch(()=>{$('#err').textContent='Could not make the code. Try again.'});
});
$('#copyCode').addEventListener('click',()=>{if(last)copy(last.code)});
$('#copyMsg').addEventListener('click',()=>{if(last)copy('Your top-up code is:\n'+last.code+'\n\nOpen Wallet in Naira Floor, paste it under "Have a top-up code?" and press Apply. It works once.')});
render();
})();
</script>

</body>
</html>
